# DGX Spark / GB10 model-serving overlay.
#
# Start the base application stack together with this file:
# docker compose --env-file ../.env -f docker-compose.yaml -f docker-compose.onprem.yaml up -d --build

services:
  deep-researcher-agent:
    environment:
      - CONFIG_FILE=/app/configs/config_web_onprem_documents.yml
      - NVIDIA_API_KEY=
      # The OpenAI-compatible embedding client requires a nonempty placeholder.
      - DEEP_RESEARCHER_EMBED_API_KEY=local
    depends_on:
      qwen:
        condition: service_healthy
      embedder:
        condition: service_healthy

  qwen:
    image: ${DEEP_RESEARCHER_VLLM_IMAGE:-vllm/vllm-openai:cu130-nightly}
    command:
      - Qwen/Qwen3.5-35B-A3B
      - --served-model-name
      - Qwen/Qwen3.5-35B-A3B
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - local
      - --language-model-only
      - --max-model-len
      - ${DEEP_RESEARCHER_VLLM_MAX_MODEL_LEN:-32768}
      - --max-num-seqs
      - "2"
      - --gpu-memory-utilization
      - ${DEEP_RESEARCHER_VLLM_GPU_MEMORY_UTILIZATION:-0.68}
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
    environment:
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - qwen-model-cache:/root/.cache/huggingface
    expose:
      - "8000"
    networks:
      - deep-researcher-network
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).close()"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 30m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities:
                - gpu
    restart: unless-stopped

  embedder:
    image: nvcr.io/nim/nvidia/nemotron-embed:2.4.1
    environment:
      NIM_ENGINE_MODEL_NAME: nvidia/Nemotron-3.5-Embed-1B-BF16
      NIM_ENGINE_PRECISION: fp16
      NIM_ENGINE_MODEL_DOWNLOAD_PROVIDER: ngc
      NGC_API_KEY: ${NGC_API_KEY:?Set NGC_API_KEY as a Workbench Secret or in the Compose environment}
    volumes:
      - nim-embed-cache:/opt/cache
      - nim-embed-weights:/model
    expose:
      - "8000"
    networks:
      - deep-researcher-network
    healthcheck:
      test: ["CMD", "/usr/local/bin/photon-engine-server", "--health-check"]
      interval: 10s
      timeout: 5s
      retries: 120
      start_period: 30m
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities:
                - gpu
    restart: unless-stopped

volumes:
  qwen-model-cache:
  nim-embed-cache:
  nim-embed-weights:
