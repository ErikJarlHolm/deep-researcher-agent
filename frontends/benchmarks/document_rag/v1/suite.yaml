  - id: multi-source-01-methane
    question: Hvorfor er raske reduksjoner i metanutslipp viktige, og hvilket konkret mål foreslås for norsk metanintensitet innen 2030?
    expected_answer: Metanreduksjoner kan gi en rask temperaturgevinst og bidra til å dempe temperaturtoppen fram mot 2050. Det foreslås mer enn 75 prosent reduksjon i metanintensiteten innen 2030.
    expected_key_points:
      - Rask temperaturgevinst
      - Dempe temperaturtoppen fram mot 2050
      - Mer enn 75 prosent reduksjon i metanintensiteten innen 2030
    answer_location: documents
    required_sources:
      - 2026-05-22_klimaskepsis.pdf
      - 2026-04-14 Klimatiltak_Norge.doc.pdf
    web_search: forbidden
    comment: Svaret skal sammenstille informasjon fra begge de oppførte kildene.

  - id: multi-source-02-affected-countries-support
    question: Hvilke land omtales både som særlig hardt rammet av klimaeffekter og som eksempler på lav- eller mellominntektsland som kan ha behov for internasjonal støtte til klimatiltak? Forklar også hvorfor støtten er viktig.
    expected_answer: Dokumentet om de mest rammede landene peker på Filippinene, Bangladesh, Pakistan, Mosambik og Haiti. Dokumentet om klimaengasjement forklarer at lav- og mellominntektsland ofte mangler finansiering og teknisk kapasitet, og at internasjonal klimafinansiering derfor er viktig for å gjennomføre tiltak. Dokumentene fastslår ikke uttrykkelig at alle de fem navngitte landene er eksempler på lav- eller mellominntektsland.
    expected_key_points:
      - Filippinene, Bangladesh, Pakistan, Mosambik og Haiti
      - Lav- og mellominntektsland mangler ofte finansiering
      - Lav- og mellominntektsland mangler ofte teknisk kapasitet
      - Internasjonal klimafinansiering er viktig
      - Kildene kobler ikke uttrykkelig alle fem landene til inntektskategorien
    answer_location: documents
    required_sources:
      - 2026-04-14 Mest-rammet-land.doc.pdf
      - 2026-05-26_klimaengasjement.pdf
    web_search: forbidden
    comment: Svaret skal sammenstille kildene uten å fremstille en indirekte kobling som eksplisitt dokumentert.

  - id: multi-source-03-transport-shipping
    question: Hvilke klimatiltak anbefales for norsk transport og skipsfart, og hvor mange internasjonale grønne skipsfartskorridorer bør Norge ha innen 2030?
    expected_answer: Norge bør elektrifisere persontransport og lette nyttekjøretøy, bygge ladeinfrastruktur, redusere transportbehovet og utvikle løsninger for tungtransport. For skipsfarten anbefales blant annet landstrøm, batterier, metanol eller ammoniakk og nullutslippskrav i anbud. Målet er minst fem internasjonale grønne korridorer fra norske havner innen 2030.
    expected_key_points:
      - Elektrifisering av persontransport og lette nyttekjøretøy
      - Ladeinfrastruktur og redusert transportbehov
      - Løsninger for tungtransport
      - Landstrøm, batterier, metanol eller ammoniakk
      - Minst fem internasjonale grønne korridorer innen 2030
    answer_location: documents
    required_sources:
      - 2026-05-26_klima_tiltak.pdf
      - 2026-04-14 Klimatiltak_Norge.doc.pdf
    web_search: forbidden
    comment: Svaret skal sammenstille informasjon fra begge de oppførte kildene.

  - id: multi-source-04-bangladesh-finance
    question: Hvilke klimaeffekter gjør Bangladesh spesielt utsatt, og hvilke norske internasjonale tiltak kan bidra til utslippsreduksjoner i framvoksende økonomier?
    expected_answer: Bangladesh er utsatt for elve- og kystflom, sykloner, stormflo, havnivåstigning og økende salinisering av jord og grunnvann. Norge kan bidra gjennom målrettet klimafinansiering via Norfund og GCF til kullutfasing, strømnett, energilagring og energieffektivisering i framvoksende økonomier.
    expected_key_points:
      - Elve- og kystflom
      - Sykloner og stormflo
      - Havnivåstigning
      - Salinisering av jord og grunnvann
      - Klimafinansiering via Norfund og GCF
      - Kullutfasing, strømnett, energilagring og energieffektivisering
    answer_location: documents
    required_sources:
      - 2026-04-14 Mest-rammet-land.doc.pdf
      - 2026-04-14 Klimatiltak_Norge.doc.pdf
    web_search: forbidden
    comment: Svaret skal sammenstille informasjon fra begge de oppførte kildene.

  - id: multi-source-05-targets-versus-action
    question: Hva er forskjellen mellom å kunngjøre et klimamål og å gjennomføre effektive klimatiltak, og hvilke indikatorer foreslås for å måle Norges faktiske framgang?
    expected_answer: Et kunngjort mål viser politisk vilje, men gir ikke nødvendigvis reelle utslippsreduksjoner dersom politikk, finansiering og gjennomføring mangler. Norges framgang bør måles med konkrete indikatorer som tonn CO₂-ekvivalenter, andel fornybar kraft, antall elektriske kjøretøy og restaurert areal, og tiltakene bør vurderes årlig.
    expected_key_points:
      - Et kunngjort mål viser politisk vilje
      - Reelle utslippsreduksjoner krever politikk, finansiering og gjennomføring
      - Tonn CO₂-ekvivalenter
      - Andel fornybar kraft
      - Antall elektriske kjøretøy
      - Restaurert areal
      - Årlig vurdering
    answer_location: documents
    required_sources:
      - 2026-05-26_klimaengasjement.pdf
      - 2026-05-26_klima_tiltak.pdf
    web_search: forbidden
    comment: Svaret skal sammenstille informasjon fra begge de oppførte kildene.

