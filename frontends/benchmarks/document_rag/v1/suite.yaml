version: 1
name: rag-climate-documents-only

defaults:
  source_policy: documents_only

tests:
  - id: single-source-01-ocean-heat
    question: Hvor stor andel av den ekstra varmen som lagres i klimasystemet, går ifølge dokumentet til havet?
    expected_answer: Mer enn 90 prosent av den ekstra varmen går til havet.
    expected_key_points:
      - Mer enn 90 prosent
      - Varmen lagres i havet
    answer_location: documents
    required_sources:
      - 2026-05-22_klimaskepsis.pdf
    web_search: forbidden
    comment: Svaret skal kunne hentes direkte fra én kilde.

